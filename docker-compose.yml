services:
  db:
    image: postgres:16-alpine
    container_name: castsim-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-castsim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-castsim_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-castsim}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-castsim} -d ${POSTGRES_DB:-castsim}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: castsim-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-castsim}:${POSTGRES_PASSWORD:-castsim_pwd}@db:5432/${POSTGRES_DB:-castsim}
      SEED_ON_START: ${SEED_ON_START:-true}
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: castsim-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
